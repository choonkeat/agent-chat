<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Chat</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <div id="chat">
      <div id="chat-header">
        <div id="voice-controls">
          <select id="voice-select"></select>
        </div>
        <button id="btn-download" title="Export chat as HTML"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8M4.5 7.5 8 11l3.5-3.5M3 13h10"/></svg></button>
        <button id="btn-settings" title="Message style settings"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v1.6M8 12.9v1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M1.5 8h1.6M12.9 8h1.6M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg></button>
      </div>
      <div id="settings-panel" hidden>
        <div id="settings-panel-inner">
          <div class="settings-title">Message style</div>
          <p class="settings-hint">Wraps every message before Claude sees it — your chat bubbles stay unchanged. Use <code>{{message}}</code> for where your text goes, or leave it out to prepend as a preamble.</p>
          <div id="settings-presets">
            <button type="button" class="preset-btn" data-preset="concise">Concise</button>
            <button type="button" class="preset-btn" data-preset="nontechnical">Non-technical</button>
            <button type="button" class="preset-btn" data-preset="direct">Direct</button>
            <button type="button" class="preset-btn" data-preset="">Off</button>
          </div>
          <textarea id="msg-style-input" rows="4" placeholder="e.g. Reply concisely and non-technically.&#10;&#10;{{message}}"></textarea>
          <div class="settings-row">
            <span id="settings-status"></span>
            <button type="button" id="btn-settings-done">Done</button>
          </div>
        </div>
      </div>
      <div id="messages">
        <div id="quick-replies"></div>
      </div>
      <div id="chat-footer">
        <div id="input-bar">
          <button id="btn-attach" title="Attach files" disabled>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 8.2l-5.6 5.6a3.5 3.5 0 0 1-5-5L9 3.2a2.3 2.3 0 0 1 3.3 3.3L6.7 12a1.2 1.2 0 0 1-1.7-1.7L10.5 5"/></svg>
          </button>
          <button id="btn-voice" title="Toggle voice mode">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1v8"/><rect x="6" y="1" width="4" height="8" rx="2"/><path d="M3.5 7a4.5 4.5 0 0 0 9 0"/><path d="M8 13v2"/></svg>
          </button>
          <div id="input-container">
            <textarea id="chat-input" rows="1" placeholder="Type a message..." disabled autofocus></textarea>
            <div id="file-staging"></div>
            <div id="autocomplete-dropdown"></div>
          </div>
          <button id="btn-send" disabled>Send</button>
        </div>
      </div>
      <input type="file" id="file-picker" multiple hidden>
    </div>
  </div>
  <!--CONFIG-->
  <script src="./canvas-bundle.js"></script>
  <script src="./app.js"></script>
</body>
</html>
