<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Chat</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <div id="chat">
      <div id="chat-header">
        <div id="voice-controls">
          <select id="voice-select"></select>
        </div>
        <button id="btn-download" title="Export chat as HTML"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8M4.5 7.5 8 11l3.5-3.5M3 13h10"/></svg></button>
        <button id="btn-settings" title="How the agent replies"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.8" y="2.2" width="12.4" height="9.2" rx="2.2"/><path d="M5 11.4v2.6l3-2.6"/><path d="M4.8 5.6h6.4M4.8 8.2h3.8"/></svg></button>
      </div>
      <div id="settings-panel" hidden>
        <div id="settings-panel-inner">
          <div class="settings-title">Message style</div>
          <p class="settings-hint">Prepended to every message before the agent sees it — your chat bubbles stay unchanged. Tick as many styles as you like; your message always goes at the bottom.</p>
          <div id="settings-presets">
            <button type="button" class="preset-btn" data-preset="concise" aria-pressed="false">Concise</button>
            <button type="button" class="preset-btn" data-preset="nontechnical" aria-pressed="false">Non-technical</button>
            <button type="button" class="preset-btn" data-preset="direct" aria-pressed="false">Direct</button>
            <button type="button" class="preset-btn" data-preset="adhd" aria-pressed="false">ADHD</button>
            <button type="button" class="preset-btn unsaved" id="preset-unsaved" data-unsaved="1" aria-pressed="true" hidden>Custom</button>
          </div>
          <textarea id="msg-style-input" rows="4" maxlength="2000" placeholder="e.g. Reply concisely and non-technically."></textarea>
          <div id="style-save-row" hidden>
            <input type="text" id="style-save-name" maxlength="40" placeholder="Name this style">
            <button type="button" id="btn-style-save-confirm">Save</button>
            <button type="button" id="btn-style-save-cancel">Cancel</button>
          </div>
          <div class="settings-row">
            <span id="settings-status"></span>
            <span class="settings-actions">
              <button type="button" id="btn-style-save">Save as…</button>
              <button type="button" id="btn-settings-done">Done</button>
            </span>
          </div>
        </div>
      </div>
      <div id="messages">
        <div id="quick-replies"></div>
      </div>
      <div id="chat-footer">
        <div id="input-bar">
          <button id="btn-attach" title="Attach files" disabled>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 8.2l-5.6 5.6a3.5 3.5 0 0 1-5-5L9 3.2a2.3 2.3 0 0 1 3.3 3.3L6.7 12a1.2 1.2 0 0 1-1.7-1.7L10.5 5"/></svg>
          </button>
          <button id="btn-voice" title="Toggle voice mode">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1v8"/><rect x="6" y="1" width="4" height="8" rx="2"/><path d="M3.5 7a4.5 4.5 0 0 0 9 0"/><path d="M8 13v2"/></svg>
          </button>
          <div id="input-container">
            <textarea id="chat-input" rows="1" placeholder="Type a message..." disabled autofocus></textarea>
            <div id="file-staging"></div>
            <div id="autocomplete-dropdown"></div>
          </div>
          <button id="btn-send" disabled>Send</button>
        </div>
      </div>
      <input type="file" id="file-picker" multiple hidden>
    </div>
  </div>
  <!--CONFIG-->
  <script src="./canvas-bundle.js"></script>
  <script src="./app.js"></script>
</body>
</html>
